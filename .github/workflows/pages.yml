name: Deploy GitHub Pages
run-name: "Frontend · ${{ github.event.head_commit.message || github.ref_name }}"

# BLT NOW | 2026-11-09 | CI_SELECTIVO_V002
# QA: se conservan las pruebas completas para uso manual; Actions usa suites de impacto.
# Respaldo: backup/ci-before-selective-20261109 (commit cb33a88051bb713576bd0b39899ca016b5d340f1)

on:
  push:
    branches: ["main"]
    # Backend puro NO ejecuta pruebas del frontend ni vuelve a publicar Pages.
    # Rutas publicadas: tools/build-frontend.js (allowlist del paquete web).
    paths:
      - 'index.html'
      - 'core/**'
      - 'modules/**'
      - 'styles/**'
      - 'assets/**'
      - 'manifest.json'
      - 'manifest-github.json'
      - 'service-worker.js'
      - '_redirects'
      - 'tools/build-frontend.js'
      - 'tools/generate-build-info.js'
      - 'tools/generate-change-audit.js'
      - 'tools/ci-run-tests.js'
      - 'tools/release-version.js'
      - 'config/releases/frontend.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  frontend_tests:
    name: Probar frontend antes de publicar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Node.js para pruebas
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Preparar dependencias para pruebas de contratos compartidos
        working-directory: ./backend
        run: npm ci --no-audit --no-fund

      - name: Validar nomenclatura API + Frontend
        run: node tools/release-version.js verify

      - name: Pruebas selectivas de frontend
        run: node tools/ci-run-tests.js frontend

      - name: Verificar empaquetado web sin archivos privados
        run: node tools/build-frontend.js

  deploy:
    name: Publicar frontend validado
    needs: frontend_tests
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Generate deployed version metadata
        run: node tools/build-frontend.js

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: 'dist/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Confirmar SHA publicado en GitHub Pages
        shell: bash
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          url="${PUBLIC_URL%/}/core/build-info.generated.js?ci_check=${GITHUB_SHA}"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-time 15 "$url" -o /tmp/blt-now-build-info.js \
              && grep -Fq "\"commit\": \"${GITHUB_SHA}\"" /tmp/blt-now-build-info.js; then
              echo "Pages OK: commit ${GITHUB_SHA} publicado"
              exit 0
            fi
            echo "Pages aun sin confirmar (intento $attempt de 12)"
            sleep 5
          done
          echo "::error::Pages no expuso el SHA esperado despues del despliegue."
          exit 1
