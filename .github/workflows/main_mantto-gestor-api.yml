name: Build and deploy Node.js app to Azure Web App - mantto-gestor-api
run-name: "API · ${{ github.event.head_commit.message || github.ref_name }}"

# BLT NOW | 2026-11-09 | CI_SELECTIVO_V002
# QA: se conservan las pruebas completas para uso manual; Actions usa suites de impacto.
# Respaldo: backup/ci-before-selective-20261109 (commit cb33a88051bb713576bd0b39899ca016b5d340f1)

on:
  push:
    branches: [main]
    # Frontend puro NO ejecuta pruebas del backend ni vuelve a desplegar Azure.
    paths:
      - 'backend/**'
      - 'tools/ci-run-tests.js'
      - '.github/workflows/main_mantto-gestor-api.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Instalar dependencias reproducibles
        working-directory: ./backend
        run: npm ci --no-audit --no-fund

      - name: Auditar dependencias
        working-directory: ./backend
        run: npm audit --audit-level=moderate

      - name: Validar y probar backend
        working-directory: ./backend
        run: |
          npm run check
          npm run build --if-present
          npm run test:contracts
          npm run test:storage
          node ../tools/ci-run-tests.js backend

      - name: Reducir dependencias para producción
        working-directory: ./backend
        run: npm prune --omit=dev --no-audit --no-fund

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-app
          if-no-files-found: error
          retention-days: 1
          path: |
            ./backend/server.js
            ./backend/package.json
            ./backend/package-lock.json
            ./backend/src
            ./backend/node_modules

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    # No cancelar un deploy Azure a medio publicar ni superponer versiones.
    concurrency:
      group: blt-now-azure-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: node-app
          path: ./release

      - name: Login to Azure
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@b686016b4de8820a23519503685d8d03fbfa03a6 # v3
        with:
          app-name: 'mantto-gestor-api'
          slot-name: 'Production'
          package: ./release

      - name: Verificar API y conexion de base de datos publicada
        shell: bash
        run: |
          set -euo pipefail
          url="https://mantto-gestor-api-a4hwfpgvbeb4gmgj.mexicocentral-01.azurewebsites.net/api/health"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-time 15 "$url" -o /tmp/blt-now-health.json \
              && node -e "const d=require('/tmp/blt-now-health.json'); if(d.ok!==true || d.database!=='connected') process.exit(1)"; then
              echo "API OK: GET /api/health y MySQL conectado"
              exit 0
            fi
            echo "API aun sin confirmar (intento $attempt de 12)"
            sleep 5
          done
          echo "::error::Azure devolvio un health check no saludable tras el despliegue."
          exit 1
