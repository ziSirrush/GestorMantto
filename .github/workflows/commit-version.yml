name: Validar nomenclatura oficial de commits
run-name: "Commit · ${{ github.event.head_commit.message || github.ref_name }}"

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nomenclatura:
    name: Version MMDDYY.N
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout con historial completo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'

      - name: Validar nomenclatura oficial y consecutivo global
        run: node tools/release-version.js verify-history
