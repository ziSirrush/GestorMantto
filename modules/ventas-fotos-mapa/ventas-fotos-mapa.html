<div class="py-page" id="vfm-page">
  <section class="py-card-shell py-module-head">
    <div>
      <p class="py-eyebrow">Fotografías · CORELLIAN + UNITED</p>
      <h1 class="py-title">Catálogo General</h1>
      <p class="py-subtitle">Catálogo unificado de proyectos con fotografías autorizadas de CORELLIAN y UNITED. Cuando existe equivalencia, ambos orígenes comparten el mismo carrusel.</p>
    </div>
    <div class="py-head-actions">
      <span id="vfm-aiven-status" class="py-connection-status">Catálogo general</span>
      <button class="py-refresh-btn" type="button" onclick="window.ManttoVentasFotosMapa && window.ManttoVentasFotosMapa.reload()">↻ Actualizar</button>
    </div>
  </section>
  <section class="py-section active">
    <div class="py-grid" id="vfm-kpis"></div>
    <div class="py-filters">
      <input type="text" id="vfm-buscar" placeholder="Buscar proyecto, ID o cliente...">
    </div>
    <div id="vfm-galeria"></div>
  </section>
</div>
