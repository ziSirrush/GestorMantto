<div class="vqd-page" id="vqd-page">
  <section class="vqd-head vqd-card">
    <div>
      <p class="vqd-eyebrow">Aiven · Ventas · Cotizaciones</p>
      <h1 id="vqd-title">Detalle de cotización</h1>
      <p id="vqd-subtitle">Consultando información comercial...</p>
    </div>
    <div class="vqd-head-actions">
      <span class="vqd-status" id="vqd-status"><i></i><span>Cargando</span></span>
      <button class="vqd-btn" id="vqd-refresh" type="button">↻ Actualizar</button>
    </div>
  </section>

  <section class="vqd-summary" id="vqd-summary"></section>

  <section class="vqd-card vqd-tabs-card">
    <nav class="vqd-tabs" aria-label="Secciones de la cotización">
      <button class="active" data-vqd-tab="general" type="button">Información</button>
      <button data-vqd-tab="comments" type="button">Comentarios</button>
      <button data-vqd-tab="files" type="button">Archivos</button>
    </nav>
    <div class="vqd-panel active" data-vqd-panel="general" id="vqd-general"></div>
    <div class="vqd-panel" data-vqd-panel="comments" id="vqd-comments"></div>
    <div class="vqd-panel" data-vqd-panel="files" id="vqd-files"></div>
  </section>
  <div class="vqd-toast" id="vqd-toast" aria-live="polite"></div>
</div>
